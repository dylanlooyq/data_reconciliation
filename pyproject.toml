[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "accelerating-tabular-reconciliation"
version = "0.1.0"
description = "A benchmark of execution strategies for row-level reconciliation of large tabular datasets."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "polars>=1.30",
    "duckdb",
    "numba",
    "psutil",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
tabrecon = "tabrecon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
